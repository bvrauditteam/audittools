name: Fast Lookup (Windows build)

on:
  push:
    paths:
      - "fast-lookup/**"
      - ".github/workflows/fast-lookup.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FastLookup.exe
        shell: cmd
        run: fast-lookup\build.bat ci

      - name: Smoke test (sample data, edge hover, screenshots)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # Fake sample rows only; real data never goes in this public repo.
          $data = Join-Path $env:LOCALAPPDATA "FastFinanceLookup\data"
          New-Item -ItemType Directory -Force $data | Out-Null
          '[{"G/L account":"1000000010","Long Text":"SAMPLE SHARE CAPITAL","":""},{"G/L account":"2050342911","Long Text":"SAMPLE BANK - CW TEST","":""}]' |
            Set-Content -Encoding UTF8 (Join-Path $data "sample_gl.json")
          '[{"Region":"EAST","RO":"RO_TEST","name":"Testpur","plant":"9999","profit center":"99992000","profit center name":"Regional Office Testpur","":""}]' |
            Set-Content -Encoding UTF8 (Join-Path $data "sample_pc.json")

          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
            # Is the sidebar header (purple) showing near the top-right corner?
            $px = $bmp.GetPixel($b.Width - 60, 20)
            $bmp.Dispose()
            return ($px.B -gt 180 -and $px.R -lt 130 -and $px.G -lt 110)
          }
          function LogCrop($name) {
            # Prints a small JPEG of the sidebar area to the log (base64) for review.
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $w = 460; $h = [Math]::Min(760, $b.Height)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen((New-Object System.Drawing.Point ($b.Width - $w), 0), [System.Drawing.Point]::Empty, $bmp.Size)
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Jpeg)
            Write-Output "CROP-$name-BEGIN"
            Write-Output ([Convert]::ToBase64String($ms.ToArray()))
            Write-Output "CROP-$name-END"
          }
          New-Item -ItemType Directory -Force shots | Out-Null

          $p = Start-Process fast-lookup\FastLookup.exe -PassThru
          Start-Sleep 3
          if ($p.HasExited) { throw "FastLookup.exe exited early with code $($p.ExitCode)" }
          if (Shot "1-closed") { throw "Sidebar visible before hover" }

          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ($vs.Right - 1), 400
          Start-Sleep -Milliseconds 1200
          if (-not (Shot "2-hover-open")) { throw "Sidebar did not open on edge hover" }

          [System.Windows.Forms.SendKeys]::SendWait("testpur")
          Start-Sleep -Milliseconds 800
          $null = Shot "3-search"
          LogCrop "search"

          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 200, 400
          Start-Sleep -Milliseconds 1500
          if (Shot "4-mouse-away-closed") { throw "Sidebar did not hide after mouse left" }
          Write-Output "Smoke test passed: opens on hover, hides on leave"

          if ($p.HasExited) { throw "FastLookup.exe crashed during the test" }
          Stop-Process $p

      - uses: actions/upload-artifact@v4
        with:
          name: FastLookup-exe
          path: fast-lookup/FastLookup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: shots/
