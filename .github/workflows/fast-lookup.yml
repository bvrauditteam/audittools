name: Fast Lookup (Windows build)

on:
  push:
    paths:
      - "fast-lookup/**"
      - ".github/workflows/fast-lookup.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build FastLookup.exe
        shell: cmd
        run: fast-lookup\build.bat ci

      - name: Smoke test (sample data, edge hover, screenshots)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # Fake sample rows only; real data never goes in this public repo.
          $data = Join-Path $env:LOCALAPPDATA "FastFinanceLookup\data"
          New-Item -ItemType Directory -Force $data | Out-Null
          '[{"G/L account":"1000000010","Long Text":"SAMPLE SHARE CAPITAL","":""},{"G/L account":"2050342911","Long Text":"SAMPLE BANK - CW TEST","":""}]' |
            Set-Content -Encoding UTF8 (Join-Path $data "sample_gl.json")
          '[{"Region":"EAST","RO":"RO_TEST","name":"Testpur","plant":"9999","profit center":"99992000","profit center name":"Regional Office Testpur","":""}]' |
            Set-Content -Encoding UTF8 (Join-Path $data "sample_pc.json")

          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
            # Is the sidebar header (purple) showing near the top-right corner?
            $px = $bmp.GetPixel($b.Width - 60, 20)
            $bmp.Dispose()
            Write-Output "STEP $name screen=$($b.Width)x$($b.Height) px=$px $([W]::State())"
            $script:open = ($px.B -gt 180 -and $px.R -lt 130 -and $px.G -lt 110)
          }
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            public static string Windows(int procId) {
              var sb = new System.Text.StringBuilder();
              EnumWindows((h, l) => {
                uint pid; GetWindowThreadProcessId(h, out pid);
                if (pid == procId) {
                  var t = new System.Text.StringBuilder(256); GetWindowText(h, t, 256);
                  var c = new System.Text.StringBuilder(256); GetClassName(h, c, 256);
                  RECT r; GetWindowRect(h, out r);
                  sb.AppendLine("  win " + h + " '" + t + "' class=" + c + " visible=" + IsWindowVisible(h) + " rect=" + r.L + "," + r.T + "," + r.R + "," + r.B);
                }
                return true;
              }, IntPtr.Zero);
              return sb.ToString();
            }
            public static string State() {
              var h = FindWindow(null, "Fast Lookup"); RECT r; GetWindowRect(h, out r);
              return "hwnd=" + h + " visible=" + IsWindowVisible(h) + " rect=" + r.L + "," + r.T + "," + r.R + "," + r.B + " foreground=" + (GetForegroundWindow() == h);
            }
          }
          "@

          $p = Start-Process fast-lookup\FastLookup.exe -PassThru
          Start-Sleep 3
          if ($p.HasExited) { throw "FastLookup.exe exited early with code $($p.ExitCode)" }
          Shot "1-closed"; $open1 = $script:open

          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point ($vs.Right - 1), 400
          Start-Sleep -Milliseconds 1200
          Shot "2-hover-open"; $open2 = $script:open
          $pos = [System.Windows.Forms.Cursor]::Position; Write-Output "cursor=$pos virtual=$vs"

          [System.Windows.Forms.SendKeys]::SendWait("testpur")
          Start-Sleep -Milliseconds 800
          Shot "3-search"

          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point 200, 400
          Start-Sleep -Milliseconds 1500
          Shot "4-mouse-away-closed"; $open4 = $script:open

          [System.Windows.Forms.SendKeys]::SendWait("^+f")
          Start-Sleep -Milliseconds 1000
          Shot "5-hotkey"; $open5 = $script:open

          Write-Output "WINDOWS of FastLookup:"; Write-Output ([W]::Windows($p.Id))
          $log = Join-Path $env:LOCALAPPDATA "FastFinanceLookup\error.log"
          if (Test-Path $log) { Write-Output "ERROR LOG:"; Get-Content $log | Select-Object -First 40 }
          Write-Output "RESULT closed=$open1 hover=$open2 away=$open4 hotkey=$open5"
          if ($open1) { throw "Sidebar visible before hover" }
          if (-not $open2) { throw "Sidebar did not open on edge hover" }
          if ($open4) { throw "Sidebar did not hide after mouse left" }
          if (-not $open5) { throw "Ctrl+Shift+F did not open the sidebar" }
          Write-Output "Smoke test passed"

          if ($p.HasExited) { throw "FastLookup.exe crashed during the test" }
          Stop-Process $p

      - uses: actions/upload-artifact@v4
        with:
          name: FastLookup-exe
          path: fast-lookup/FastLookup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: shots/
